<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Shop - Shop POS</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <!-- Navigation -->

    <nav>
      <h2>Shop POS</h2>

      <div>
        <a href="/dashboard"> Dashboard </a>
        <a href="/products"> Products </a>
        <a href="/sale"> Make Sale </a>
        <a href="/sales"> Sales History </a>
        <a href="/low-stock"> Low Stock </a>
        <a href="/customers"> Customers </a>
        <a href="/create-shop"> Create Shop </a>
        <a href="/create-invite"> Create Invite </a>
      </div>
    </nav>

    <!-- Main Content -->

    <main>
      <h1>Create Shop</h1>

      <div class="form-container">
        {% if success %}

        <p>
          <strong>Shop created: {{ shop_name }}</strong> (ID: {{ shop_id }})
        </p>

        <br />

        <a href="/create-invite">
          <button type="button" class="sell-button">
            Next: Create Login Link
          </button>
        </a>

        <br /><br />

        <a href="/create-shop"> Create another shop </a>

        {% else %}

        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

          <!-- Shop Name -->

          <label for="name"> Shop Name </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter shop name"
            required
          />

          <!-- Phone -->

          <label for="phone"> Phone Number </label>

          <input
            type="text"
            id="phone"
            name="phone"
            placeholder="Enter phone number"
          />

          <!-- Email -->

          <label for="email"> Email </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email address"
          />

          <!-- Submit -->

          <button type="submit" class="sell-button">Create Shop</button>
        </form>

        {% endif %}
      </div>

      <br />

      <a href="/dashboard"> ← Back to Dashboard </a>
    </main>
  </body>
</html>
