<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Product - Shop POS</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <!-- Navigation Bar -->

    <nav>
      <h2>Shop POS</h2>

      <div>
        <a href="/dashboard"> Dashboard </a>

        <a href="/products"> Products </a>

        <a href="/sale"> Make Sale </a>

        <a href="/sales"> Sales History </a>
      </div>
    </nav>

    <!-- Main Content -->

    <main>
      <h1>Add Product</h1>

      <div class="form-container">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <!-- Product Name -->

          <label for="name"> Product Name </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter product name"
            required
          />

          <!-- Quantity -->

          <label for="quantity"> Quantity </label>

          <input
            type="number"
            id="quantity"
            name="quantity"
            min="0"
            placeholder="Enter quantity"
            required
          />

          <!-- Buying Price -->

          <label for="buying_price"> Buying Price </label>

          <input
            type="number"
            id="buying_price"
            name="buying_price"
            min="0"
            step="0.01"
            placeholder="Enter buying price"
            required
          />

          <!-- Selling Price -->

          <label for="selling_price"> Selling Price </label>

          <input
            type="number"
            id="selling_price"
            name="selling_price"
            min="0"
            step="0.01"
            placeholder="Enter selling price"
            required
          />

          <!-- Submit Button -->

          <button type="submit" class="sell-button">Add Product</button>
        </form>
      </div>

      <br />

      <a href="/products"> ← Back to Products </a>
    </main>
  </body>
</html>
